name: benchmark

# Manual dispatch only. Hosted runners are shared, unpinned hardware, so the
# numbers here are indicative — useful for a quick sanity check, never
# published anywhere. Official numbers come from the reference machine via
# bench/update_benchmark_readme.py (see the Benchmarks section in README.md).

on:
  workflow_dispatch:

env:
  MAVEN_OPTS: -Djava.security.egd=file:/dev/./urandom

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}

jobs:
  benchmark:
    name: Run JMH benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Resolve library version
        id: version
        run: |
          VERSION=$(./mvnw --quiet help:evaluate -Dexpression=project.version -DforceStdout)
          echo "full=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install library to the local repository
        run: ./mvnw --batch-mode -DskipTests clean install

      - name: Build benchmarks
        run: ./mvnw --batch-mode -f bench/pom.xml -Dcorrcalc.version=${{ steps.version.outputs.full }} clean package

      - name: Run JMH
        run: java -jar bench/target/benchmarks.jar -rf json -rff jmh-results.json

      - name: Upload raw results
        uses: actions/upload-artifact@v7
        with:
          name: jmh-results
          path: jmh-results.json
          retention-days: 30
