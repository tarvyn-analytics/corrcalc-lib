name: validate-on-pull-request

on:
  pull_request:
    branches: [ "develop", "main" ]
    types: [opened, reopened, synchronize]

env:
  MAVEN_OPTS: -Djava.security.egd=file:/dev/./urandom

jobs:
  verify:
    name: Verify PR
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # -Ppublish builds the source and javadoc jars too, so a PR cannot
      # merge with javadoc errors that would break publishing on push.
      # install (not verify) so the bench build below can resolve the lib.
      - name: Build, test and enforce coverage
        run: ./mvnw --batch-mode -Ppublish clean install

      # Bit-rot guard: bench/ is standalone and only ever run by hand, so
      # this is the one place an API drift in the benchmarks would surface.
      - name: Compile benchmarks
        run: |
          VERSION=$(./mvnw --quiet help:evaluate -Dexpression=project.version -DforceStdout)
          ./mvnw --batch-mode -f bench/pom.xml -Dcorrcalc.version="${VERSION}" clean package

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14
