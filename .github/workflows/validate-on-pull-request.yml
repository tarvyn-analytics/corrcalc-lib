name: validate-on-pull-request

on:
  pull_request:
    branches: [ "develop", "main" ]
    types: [opened, reopened, synchronize]

env:
  MAVEN_OPTS: -Djava.security.egd=file:/dev/./urandom

jobs:
  verify:
    name: Verify PR
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # -Ppublish builds the source and javadoc jars too, so a PR cannot
      # merge with javadoc errors that would break publishing on push.
      # The reactor builds bench/ as well — the benchmark bit-rot guard.
      - name: Build, test and enforce coverage
        run: ./mvnw --batch-mode -Ppublish clean verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: corrcalc-lib-core/target/site/jacoco/
          retention-days: 14
