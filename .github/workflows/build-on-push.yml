name: build-on-push

on:
  push:
    branches: [ "develop", "main" ]

env:
  MAVEN_OPTS: -Djava.security.egd=file:/dev/./urandom

jobs:
  build:
    name: Build library
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build, test and enforce coverage
        run: ./mvnw --batch-mode clean verify

      - name: Upload library jar
        uses: actions/upload-artifact@v4
        with:
          name: corrcalc-lib
          path: target/corrcalc-lib-*.jar
          retention-days: 30
