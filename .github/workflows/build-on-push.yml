name: build-on-push

on:
  push:
    branches: [ "develop", "main" ]

env:
  MAVEN_OPTS: -Djava.security.egd=file:/dev/./urandom

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Build and publish library
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # setup-java writes a settings.xml whose server id "github" matches
      # distributionManagement in pom.xml, authenticating with GITHUB_TOKEN.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # develop publishes the SNAPSHOT as-is; main strips the suffix and
      # publishes the release. GitHub Packages rejects re-publishing an
      # existing release version, so every merge to main must carry a
      # version bump on develop first.
      - name: Strip -SNAPSHOT for release publishing
        if: github.ref_name == 'main'
        run: ./mvnw --batch-mode versions:set -DremoveSnapshot -DgenerateBackupPoms=false

      # Deploys corrcalc-parent (consumers resolve it as corrcalc-lib's
      # parent pom) and corrcalc-lib; bench sets maven.deploy.skip.
      - name: Build, test, enforce coverage and publish to GitHub Packages
        run: ./mvnw --batch-mode -Ppublish clean deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag release
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(./mvnw --quiet help:evaluate -Dexpression=project.version -DforceStdout)
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/v${VERSION}" -f sha="${GITHUB_SHA}"

      - name: Upload library jar
        uses: actions/upload-artifact@v7
        with:
          name: corrcalc-lib
          path: lib/target/corrcalc-lib-*.jar
          retention-days: 30
